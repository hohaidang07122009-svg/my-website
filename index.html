<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7991 Exam Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}header{background:#2563eb;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:16px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tab,button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.tab{background:white;border:1px solid #ddd}.tab.on{background:#dbeafe;color:#1d4ed8}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:14px}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd2dc;border-radius:8px;font:inherit}textarea{min-height:80px}.primary{background:#2563eb;color:white}.danger{background:#fee2e2;color:#b91c1c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{border:1px solid #ddd;border-radius:10px;padding:13px;margin:10px 0}.muted{color:#667085;font-size:13px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px}th{background:#f8fafc}.paper{background:#fff;padding:25px;max-width:850px;margin:auto}.badge{font-size:11px;background:#eef2ff;padding:4px 7px;border-radius:20px}.opts{margin-top:7px}@media(max-width:700px){.c6,.c4{grid-column:span 12}}@media print{header,.tabs,.noprint{display:none}.page{display:none!important}#preview{display:block!important}.paper{box-shadow:none}}
</style></head><body>
<header><h1>7991 Exam Builder</h1><div>Công cụ tạo ma trận · bản đặc tả · đề kiểm tra</div></header><main>
<div class="tabs"><button class="tab on" onclick="go('info',this)">Thông tin</button><button class="tab" onclick="go('matrix',this)">Ma trận</button><button class="tab" onclick="go('spec',this)">Bản đặc tả</button><button class="tab" onclick="go('questions',this)">Câu hỏi</button><button class="tab" onclick="go('preview',this)">Xem đề</button></div>

<section id="info" class="page on"><div class="box"><h2>Thông tin bài kiểm tra</h2><div class="grid">
<div class="c6"><label>Môn</label><input id="subject" placeholder="Vật lí"></div><div class="c6"><label>Lớp</label><input id="grade" placeholder="12"></div>
<div class="c6"><label>Thời gian (phút)</label><input id="duration" type="number" value="45"></div><div class="c6"><label>Học kỳ</label><select id="semester"><option>Học kỳ I</option><option>Học kỳ II</option><option>Cả năm</option></select></div>
<div class="c12"><label>Phạm vi kiến thức</label><textarea id="scope" placeholder="Nhập chủ đề/phạm vi..."></textarea></div></div></div>
<div class="box"><b>Mẫu điểm:</b> 7 điểm trắc nghiệm + 3 điểm tự luận. Có thể chỉnh điểm từng câu.</div></section>

<section id="matrix" class="page"><div class="box"><div class="row" style="justify-content:space-between"><h2>Ma trận</h2><button class="primary" onclick="addM()">+ Thêm dòng</button></div><div style="overflow:auto"><table><thead><tr><th>Chủ đề</th><th>NB</th><th>TH</th><th>VD</th><th>Tổng câu</th><th>Xóa</th></tr></thead><tbody id="mb"></tbody></table></div><p><b>Tổng số câu: <span id="mt">0</span></b></p></div></section>

<section id="spec" class="page"><div class="box"><div class="row" style="justify-content:space-between"><h2>Bản đặc tả</h2><button class="primary" onclick="addS()">+ Thêm</button></div><div id="sl"></div></div></section>

<section id="questions" class="page"><div class="box"><div class="row" style="justify-content:space-between"><h2>Câu hỏi</h2><button class="primary" onclick="addQ()">+ Thêm câu</button></div><div id="ql"></div></div></section>

<section id="preview" class="page"><div class="box noprint"><button class="primary" onclick="window.print()">🖨 In / lưu PDF</button></div><div class="paper" id="paper"></div></section>
</main>
<script>
let M=[],S=[],Q=[];
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(id==='preview')preview()}
function addM(x={t:'',nb:0,th:0,vd:0}){M.push(x);renderM()}function renderM(){mb.innerHTML=M.map((r,i)=>`<tr><td><input value="${esc(r.t)}" oninput="M[${i}].t=this.value"></td><td><input type=number value="${r.nb}" oninput="M[${i}].nb=this.value;renderM()"></td><td><input type=number value="${r.th}" oninput="M[${i}].th=this.value;renderM()"></td><td><input type=number value="${r.vd}" oninput="M[${i}].vd=this.value;renderM()"></td><td>${+r.nb + +r.th + +r.vd}</td><td><button class=danger onclick="M.splice(${i},1);renderM()">X</button></td></tr>`).join('');mt.textContent=M.reduce((a,r)=>a++ + +r.nb + +r.th + +r.vd,0)}
function addS(x={t:'',l:'Nhận biết',r:'',d:'Trắc nghiệm'}){S.push(x);renderS()}function renderS(){sl.innerHTML=S.map((r,i)=>`<div class=item><div class=grid><div class=c4><label>Chủ đề</label><input value="${esc(r.t)}" oninput="S[${i}].t=this.value"></div><div class=c4><label>Mức độ</label><select onchange="S[${i}].l=this.value"><option ${r.l==='Nhận biết'?'selected':''}>Nhận biết</option><option ${r.l==='Thông hiểu'?'selected':''}>Thông hiểu</option><option ${r.l==='Vận dụng'?'selected':''}>Vận dụng</option></select></div><div class=c4><label>Dạng</label><select onchange="S[${i}].d=this.value"><option>Trắc nghiệm</option><option>Đúng/Sai</option><option>Trả lời ngắn</option><option>Tự luận</option></select></div><div class=c12><label>Yêu cầu cần đạt</label><textarea oninput="S[${i}].r=this.value">${esc(r.r)}</textarea></div></div><button class=danger onclick="S.splice(${i},1);renderS()">Xóa</button></div>`).join('')}
function addQ(x={type:'MCQ',text:'',a:['','','',''],ans:'',p:.25,l:'Nhận biết'}){Q.push(x);renderQ()}function renderQ(){ql.innerHTML=Q.map((q,i)=>{let opts=q.type==='MCQ'?q.a.map((v,j)=>`<input style="margin:3px 0" value="${esc(v)}" placeholder="${String.fromCharCode(65+j)}" oninput="Q[${i}].a[${j}]=this.value">`).join(''):'';return `<div class=item><div class=grid><div class=c4><label>Dạng</label><select onchange="Q[${i}].type=this.value;renderQ()"><option value=MCQ ${q.type==='MCQ'?'selected':''}>Nhiều lựa chọn</option><option value=TF ${q.type==='TF'?'selected':''}>Đúng/Sai</option><option value=SHORT ${q.type==='SHORT'?'selected':''}>Trả lời ngắn</option><option value=ESSAY ${q.type==='ESSAY'?'selected':''}>Tự luận</option></select></div><div class=c4><label>Mức độ</label><select onchange="Q[${i}].l=this.value"><option>Nhận biết</option><option>Thông hiểu</option><option>Vận dụng</option></select></div><div class=c4><label>Điểm</label><input type=number step=.01 value="${q.p}" oninput="Q[${i}].p=this.value"></div><div class=c12><label>Nội dung</label><textarea oninput="Q[${i}].text=this.value">${esc(q.text)}</textarea></div><div class=c12>${opts}</div><div class=c12><label>Đáp án / hướng dẫn chấm</label><input value="${esc(q.ans)}" oninput="Q[${i}].ans=this.value"></div></div><button class=danger onclick="Q.splice(${i},1);renderQ()">Xóa</button></div>`}).join('')}
function preview(){paper.innerHTML=`<h2 style="text-align:center">${esc(subject.value||'BÀI KIỂM TRA')}</h2><p style="text-align:center">Lớp ${esc(grade.value)} · ${esc(semester.value)} · ${esc(duration.value)} phút</p>`+Q.map((q,i)=>`<div class=item><b>Câu ${i+1}.</b> <span class=badge>${q.type} · ${q.l} · ${q.p} điểm</span><p>${esc(q.text)||'...'}</p>${q.type==='MCQ'?'<ol type=A>'+q.a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':''}</div>`).join('')+'<hr><h3>ĐÁP ÁN</h3>'+Q.map((q,i)=>`<p><b>${i+1}.</b> ${esc(q.ans)||'—'}</p>`).join('')}
addM({t:'Chủ đề 1',nb:2,th:1,vd:1});addS({t:'Chủ đề 1',r:'Nêu/nhận biết được kiến thức cốt lõi.'});addQ();renderM();renderS();renderQ();
</script></body></html>
